[workspace]
resolver = "2"
members = [
  "examples/atropos",
  "examples/rifl",
  "examples/r2p2",
  "examples/persephone",
  "examples/protego",
  "examples/policy-composition",
  "examples/masa/masa", "examples/masa/masa-core", "examples/masa/masa-policy", "examples/masa/masa-semantics",
  "examples/rajomon", "examples/tailclipper",
  "examples/aequitas",
  "examples/c3",
  "examples/hedged",
  "examples/breakwater",
  "examples/dagor", "examples/testkit",
  "libs/rpcstack-call",
  "examples/echo",
  "libs/rpcstack", "libs/rpcstack-wire", "libs/rpcstack-tonic", "libs/rpcstack-sched",
  "libs/tonic/tonic", "libs/tonic/tonic-build", "libs/hyper", "libs/tokio/tokio",
  "libs/multiqueue-prio-queue",
]
default-members = ["libs/rpcstack", "libs/rpcstack-wire", "libs/rpcstack-tonic", "libs/rpcstack-sched"]

[patch.crates-io]
tokio = { path = "libs/tokio/tokio" }
hyper = { path = "libs/hyper" }
