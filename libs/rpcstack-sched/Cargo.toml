[package]
name = "rpcstack-sched"
version = "0.1.0"
edition = "2021"
publish = false
description = "Run-queue interface, task metadata, built-in queues and default spawn policy for the RPC stack runtime"

# Leaf crate: must not depend on tokio, tonic, hyper or concrete policy crates.
[dependencies]

[features]
default = []
# Select the priority-heap queue instead of FIFO.
sched_prio = []
# Select `custom::Queue`, the slot for a new queue. Takes precedence over the
# other selecting features.
sched_custom = []
# Record the calls `custom::Queue` receives in `trace`. For tests of the
# runtime only; has no effect on any queue's behavior.
lifecycle_trace = []
