[package]
name = "rpcstack-echo"
version = "0.1.0"
edition = "2021"
publish = false

[features]
priority = ["tokio/sched_prio", "tonic/rpcstack"]

[dependencies]
rpcstack = { path = "../../libs/rpcstack" }
rpcstack-tonic = { path = "../../libs/rpcstack-tonic" }
rpcstack-wire = { path = "../../libs/rpcstack-wire" }
tonic = { path = "../../libs/tonic/tonic" }
tokio = { path = "../../libs/tokio/tokio", features = ["macros", "rt", "net", "time"] }
tokio-stream = { version = "=0.1.15", features = ["net"] }
prost = "0.12"

[build-dependencies]
tonic-build = { path = "../../libs/tonic/tonic-build" }
