[package]
name = "rpcstack-rifl"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
rpcstack-call = { path = "../../../libs/rpcstack-call" }
tonic = { path = "../../../libs/tonic/tonic" }
tokio = { path = "../../../libs/tokio/tokio", features = ["rt", "time", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
[dev-dependencies]
tempfile = "3"
rpcstack-testkit = { path = "../../testkit" }
rpcstack-tonic = { path = "../../../libs/rpcstack-tonic" }
tokio = { path = "../../../libs/tokio/tokio", features = ["macros", "rt", "test-util"] }
