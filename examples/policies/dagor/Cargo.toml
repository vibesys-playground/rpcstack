[package]
name = "rpcstack-dagor"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
rpcstack = { path = "../../../libs/rpcstack" }
rpcstack-tonic = { path = "../../../libs/rpcstack-tonic" }
tonic = { path = "../../../libs/tonic/tonic" }
tokio = { path = "../../../libs/tokio/tokio", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
rpcstack-testkit = { path = "../../testkit" }
tokio = { path = "../../../libs/tokio/tokio", features = ["macros", "rt", "time"] }
